{{ define "main" }}
{{ with site.GetPage "section" "posts" }}
<main class="posts-feed" aria-label="文章列表">
    {{ $paginator := $.Paginate .RegularPages.ByDate.Reverse }}
    {{ range $paginator.Pages }}
        {{ partial "post-preview.html" . }}
    {{ end }}
</main>
{{ partial "pagination.html" $ }}
{{ else }}
<p>No posts available.</p>
{{ end }}
{{ end }}
