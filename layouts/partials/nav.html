<header>
    <div class="main">
        {{ $homeAvatar := .Site.Params.home_avatar | default .Site.Params.avatar }}
        {{ if $homeAvatar }}
        <a href="{{ "/posts/" | relURL }}" class="home-link home-avatar" aria-label="文章列表">
            <img src="{{ $homeAvatar | relURL }}" alt="" width="26" height="26">
        </a>
        {{ else if .Site.Params.logo }}
        <a href="{{ "/posts/" | relURL }}" class="logo" aria-label="文章列表">
            <img alt="{{ .Site.Title }}" src="{{ .Site.Params.logo | relURL }}">
        </a>
        {{ else }}
        <a href="{{ "/posts/" | relURL }}" class="home-link home-avatar home-avatar-default" aria-label="文章列表">
            <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="11" r="4.5" fill="currentColor"/>
                <path d="M7 28v-3a9 9 0 0 1 18 0v3Z" fill="currentColor"/>
            </svg>
        </a>
        {{ end }}

        <div class="socials">
            {{ range .Site.Params.social }}
            <a rel="me" href="{{ .url }}" class="social">
                <img alt="{{ .name }}" src="{{ printf "/icons/social/%s.svg" .icon | relURL }}">
            </a>
            {{ end }}
        </div>
    </div>

    <nav>
        {{ range .Site.Params.menu }}
        <a href="{{ .url | relURL }}">{{ .name }}</a>
        {{ end }}
        |
        {{ if eq .Site.Params.theme "toggle" }}
        <button type="button" id="dark-mode-toggle" onclick="toggleTheme()" aria-label="切换深浅主题">
            <img src="{{ "/icons/sun.svg" | relURL }}" id="sun-icon" style="filter: invert(1)" alt="Light" />
            <img src="{{ "/icons/moon.svg" | relURL }}" id="moon-icon" alt="Dark" />
        </button>
        {{ end }}
    </nav>
</header>
